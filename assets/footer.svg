<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#120e24"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="65%"  stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fclip"><rect width="1200" height="90" rx="14"/></clipPath>
    <style>
      .fmono { font-family: ui-monospace, "SFMono-Regular", "Fira Code", Menlo, Consolas, monospace; }
      @keyframes slide { to { stroke-dashoffset: -400; } }
      @keyframes glow  { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes tick  { 0%,100% { opacity: .25; } 50% { opacity: .8; } }
      .stream { animation: slide 6s linear infinite; }
      .beam   { animation: glow 4s ease-in-out infinite; }
      .d1 { animation: tick 3s ease-in-out infinite; }
      .d2 { animation: tick 3s ease-in-out infinite .6s; }
      .d3 { animation: tick 3s ease-in-out infinite 1.2s; }
    </style>
  </defs>

  <g clip-path="url(#fclip)">
    <rect width="1200" height="90" fill="url(#fbg)"/>
    <rect class="beam" x="0" y="0" width="1200" height="2" fill="url(#line)"/>
    <line class="stream" x1="0" y1="45" x2="1200" y2="45" stroke="#1e293b"
          stroke-width="1.5" stroke-dasharray="2 12"/>

    <text class="fmono" x="600" y="42" font-size="13" fill="#64748b" letter-spacing="2"
          text-anchor="middle">BUILT WITH CARE &#183; SHIPPED WITH TESTS &#183; SECURED BY DESIGN</text>

    <g text-anchor="middle">
      <circle class="d1" cx="576" cy="62" r="3" fill="#38bdf8"/>
      <circle class="d2" cx="600" cy="62" r="3" fill="#818cf8"/>
      <circle class="d3" cx="624" cy="62" r="3" fill="#c084fc"/>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="89" rx="14" fill="none" stroke="#1e293b"/>
  </g>
</svg>
