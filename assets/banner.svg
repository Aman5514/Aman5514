<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Aman Gupta — Full-Stack Engineer, DevOps, Security and Compliance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#11162a"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="280" rx="16"/>
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "Fira Code", Menlo, Consolas, monospace; }
      .sans { font-family: "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", sans-serif; }

      @keyframes drift  { to   { transform: translate(-40px, -40px); } }
      @keyframes blink  { 0%,45% { opacity: 1; } 50%,95% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes floatA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(26px,-16px); } }
      @keyframes floatB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-22px,14px); } }
      @keyframes travel { 0% { transform: translateX(0); opacity: 0; }
                          8% { opacity: 1; }
                          92% { opacity: 1; }
                          100% { transform: translateX(560px); opacity: 0; } }
      @keyframes pop    { 0%,100% { r: 6; opacity: .55; } 50% { r: 9; opacity: 1; } }
      @keyframes spin   { to { transform: rotate(360deg); } }
      @keyframes dash   { to { stroke-dashoffset: -260; } }
      @keyframes breathe{ 0%,100% { opacity: .35; } 50% { opacity: .9; } }
      @keyframes sweep  { 0% { opacity: 0; } 12% { opacity: .5; } 40% { opacity: 0; } 100% { opacity: 0; } }

      .grid   { animation: drift 7s linear infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .blobA  { animation: floatA 11s ease-in-out infinite; }
      .blobB  { animation: floatB 13s ease-in-out infinite; }
      .pulse  { animation: travel 4.2s cubic-bezier(.45,0,.55,1) infinite; }
      .n1     { animation: pop 4.2s ease-in-out infinite; }
      .n2     { animation: pop 4.2s ease-in-out infinite .5s; }
      .n3     { animation: pop 4.2s ease-in-out infinite 1s; }
      .n4     { animation: pop 4.2s ease-in-out infinite 1.5s; }
      .ring   { animation: spin 18s linear infinite; transform-origin: 1040px 140px; }
      .flow   { animation: dash 3.4s linear infinite; }
      .glint  { animation: breathe 3.6s ease-in-out infinite; }
      .scan   { animation: sweep 5s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <g class="grid"><rect x="-40" y="-40" width="1280" height="360" fill="url(#grid)"/></g>

    <g filter="url(#soft)">
      <circle class="blobA" cx="215" cy="70"  r="135" fill="url(#glowA)"/>
      <circle class="blobB" cx="1010" cy="215" r="150" fill="url(#glowB)"/>
    </g>

    <rect class="scan" x="0" y="0" width="1200" height="280" fill="#38bdf8" opacity="0"/>

    <g transform="translate(44,46)">
      <circle cx="0"  cy="-4" r="5" fill="#ff5f57"/>
      <circle cx="18" cy="-4" r="5" fill="#febc2e"/>
      <circle cx="36" cy="-4" r="5" fill="#28c840"/>
      <text class="mono" x="58" y="1" font-size="15" fill="#64748b">
        <tspan fill="#38bdf8">aman</tspan><tspan fill="#475569">@</tspan><tspan fill="#818cf8">secure</tspan><tspan fill="#475569">:~$</tspan>
        <tspan fill="#94a3b8"> ./ship --audit --hipaa</tspan>
      </text>
      <rect class="cursor" x="360" y="-11" width="9" height="15" fill="#38bdf8"/>
    </g>

    <text class="sans" x="44" y="146" font-size="62" font-weight="700" letter-spacing="1" fill="url(#nameGrad)">Aman Gupta</text>
    <text class="mono" x="46" y="180" font-size="16" fill="#8b9bb4" letter-spacing="2.4">
      FULL-STACK ENGINEER<tspan fill="#475569"> · </tspan>DEVOPS<tspan fill="#475569"> · </tspan>SECURITY &amp; COMPLIANCE
    </text>

    <g transform="translate(46,232)">
      <line x1="0" y1="0" x2="560" y2="0" stroke="url(#wire)" stroke-width="2"/>
      <line class="flow" x1="0" y1="0" x2="560" y2="0" stroke="#38bdf8" stroke-width="2"
            stroke-dasharray="6 14" opacity="0.65"/>
      <circle class="pulse" cx="0" cy="0" r="4.5" fill="#7dd3fc"/>

      <g fill="#0d1117" stroke="#38bdf8" stroke-width="2">
        <circle class="n1" cx="0"   cy="0" r="6"/>
        <circle class="n2" cx="187" cy="0" r="6"/>
        <circle class="n3" cx="374" cy="0" r="6"/>
        <circle class="n4" cx="560" cy="0" r="6"/>
      </g>

      <g class="mono" font-size="11.5" fill="#64748b" letter-spacing="1.6" text-anchor="middle">
        <text x="0"   y="24">COMMIT</text>
        <text x="187" y="24">BUILD</text>
        <text x="374" y="24">SCAN</text>
        <text x="560" y="24">SHIP</text>
      </g>
    </g>

    <g transform="translate(1040,140)">
      <g class="ring" transform="translate(-1040,-140)">
        <circle cx="1040" cy="140" r="82" fill="none" stroke="#334155"
                stroke-width="1.5" stroke-dasharray="3 9"/>
      </g>
      <circle class="glint" r="66" fill="none" stroke="#1e3a5f" stroke-width="1"/>
      <path d="M0,-58 L46,-38 V6 C46,36 24,54 0,62 C-24,54 -46,36 -46,6 V-38 Z"
            fill="#0b1220" stroke="url(#nameGrad)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-19,2 L-6,16 L21,-16" fill="none" stroke="#38bdf8" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="279" rx="16" fill="none" stroke="#1e293b" stroke-width="1"/>
  </g>
</svg>
